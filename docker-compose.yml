services:
  db:
    image: mariadb:latest
    container_name: task-flow-pro-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: defaultdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app_password_123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-flow-pro-backend
    container_name: task-flow-pro-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_USERNAME: appuser
      DB_PASSWORD: app_password_123
      DB_NAME: defaultdb
      DB_DATABASE: defaultdb
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
